services:
  - type: web
    name: windscope-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: "https://windscope-vijay.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: PYTHON_VERSION
        value: "3.11.9"
